<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pay {{ business }}{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --accent: #3b5bdb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
           background: Canvas; color: CanvasText; }
    .card { width: 100%; max-width: 420px; padding: 32px; border-radius: 12px;
            border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    p.sub { margin: 0 0 24px; opacity: .7; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; padding: 10px 12px; font: inherit; border-radius: 8px;
            border: 1px solid color-mix(in srgb, CanvasText 30%, transparent); background: Canvas; color: inherit; }
    .amount { display: flex; align-items: center; gap: 8px; }
    button, .btn { display: inline-block; width: 100%; margin-top: 24px; padding: 12px; font: inherit; font-weight: 600;
             text-align: center; text-decoration: none; color: #fff; background: var(--accent);
             border: 0; border-radius: 8px; cursor: pointer; }
    .error { padding: 10px 12px; border-radius: 8px; background: #fde8e8; color: #9b1c1c; }
    .fine { margin-top: 16px; font-size: .85rem; opacity: .6; text-align: center; }
  </style>
</head>
<body>
  <main class="card">{% block content %}{% endblock %}</main>
</body>
</html>
